name: Build Turnip

on:
  workflow_dispatch:
    inputs:
      force:
        description: Build even when the upstream source has not changed
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check-upstream:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      mesa_sha: ${{ steps.upstream.outputs.sha }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Read latest Mesa commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git HEAD | cut -f1)"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not determine the latest Mesa commit." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Compare with the last successfully built commit
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin upstream-state >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/upstream-state
            previous="$(git show FETCH_HEAD:mesa-upstream.sha)"
          else
            previous=""
          fi

          if [[ "$previous" == "${{ steps.upstream.outputs.sha }}" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Mesa has no new commits since the last successful build."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Mesa has a new commit (or this is the first build)."
          fi

  build:
    needs: check-upstream
    if: >-
      needs.check-upstream.outputs.changed == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.force)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bison \
            flex \
            git \
            glslang-dev \
            glslang-tools \
            libarchive-dev \
            libdrm-dev \
            libexpat1-dev \
            libvulkan-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-dri3-dev \
            libxcb-present-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxdamage-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxshmfence-dev \
            libxxf86vm-dev \
            libzstd-dev \
            m4 \
            pkg-config \
            python3 \
            python3-mako \
            python3-packaging \
            python3-pip \
            python3-ply \
            python3-yaml
          python3 -m pip install --break-system-packages meson ninja

      - name: Fetch the checked Mesa revision
        env:
          MESA_SHA: ${{ needs.check-upstream.outputs.mesa_sha }}
        run: |
          set -euo pipefail
          mesa_dir="$RUNNER_TEMP/mesa"
          git init "$mesa_dir"
          git -C "$mesa_dir" remote add origin https://gitlab.freedesktop.org/mesa/mesa.git
          git -C "$mesa_dir" fetch --depth=1 origin "$MESA_SHA"
          git -C "$mesa_dir" checkout --detach FETCH_HEAD

      - name: Configure and build Turnip
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" != "aarch64" ]]; then
            echo "Expected an ARM64 runner; got $(uname -m)." >&2
            exit 1
          fi
          test -x /usr/bin/python3.12
          cd "$RUNNER_TEMP/mesa"
          cat > native.ini <<'EOF'
          [binaries]
          python = '/usr/bin/python3.12'
          EOF
          meson . build \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmds=msm,kgsl \
            -Dglvnd=disabled \
            -Dplatforms=x11 \
            -Dxmlconfig=enabled \
            -Dllvm=disabled \
            -Dopengl=false \
            -Degl=disabled \
            -Dzstd=enabled \
            --native-file=native.ini
          ninja -C build

      - name: Install and package build output
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/turnip-install"
          archive="$RUNNER_TEMP/turnip-${{ needs.check-upstream.outputs.mesa_sha }}.tar.gz"
          mkdir -p "$install_root"
          DESTDIR="$install_root" ninja -C "$RUNNER_TEMP/mesa/build" install
          if [[ ! -d "$install_root/usr/local" ]]; then
            echo "Expected installed files under usr/local; staging directory contents:" >&2
            find "$install_root" -maxdepth 4 -print >&2
            exit 1
          fi
          if ! find "$install_root/usr/local" -type f -name 'libvulkan_freedreno.so' -print -quit | grep -q .; then
            echo "Turnip driver libvulkan_freedreno.so was not found in the install tree." >&2
            find "$install_root/usr/local" -maxdepth 5 -print >&2
            exit 1
          fi
          tar -C "$install_root" -czf "$archive" .
          tar -tzf "$archive" > "$RUNNER_TEMP/turnip-archive-files.txt"
          grep -qE '^\./usr/local/' "$RUNNER_TEMP/turnip-archive-files.txt" || {
            echo "Archive does not preserve the expected ./usr/local/ install path." >&2
            cat "$RUNNER_TEMP/turnip-archive-files.txt" >&2
            exit 1
          }

      - name: Upload Turnip build artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-${{ needs.check-upstream.outputs.mesa_sha }}
          path: ${{ runner.temp }}/turnip-${{ needs.check-upstream.outputs.mesa_sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish archive to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          MESA_SHA: ${{ needs.check-upstream.outputs.mesa_sha }}
        run: |
          set -euo pipefail
          tag="turnip-mesa-${MESA_SHA}"
          archive="$RUNNER_TEMP/turnip-${MESA_SHA}.tar.gz"
          title="Turnip build for Mesa ${MESA_SHA}"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --title "$title" \
              --notes "ARM64 Turnip build from Mesa commit ${MESA_SHA}."
          fi

      - name: Record successfully built Mesa revision
        env:
          MESA_SHA: ${{ needs.check-upstream.outputs.mesa_sha }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin upstream-state >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/upstream-state
            git switch --create upstream-state FETCH_HEAD
          else
            git switch --create upstream-state
          fi
          printf '%s\n' "$MESA_SHA" > mesa-upstream.sha
          git add mesa-upstream.sha
          if git diff --cached --quiet; then
            echo "The recorded Mesa revision is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Record successfully built Mesa revision"
          git push origin HEAD:refs/heads/upstream-state
